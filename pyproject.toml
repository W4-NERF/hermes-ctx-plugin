# Development tooling only. The plugin itself is the ``plugin/`` directory, installed into
# ``$HERMES_HOME/plugins/ctx/`` (see README) — it has no third-party dependencies.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # German prose and typographic dashes/arrows are intentional
    "SIM105",                      # explicit try/except/pass reads clearer in cleanup paths
    "UP017",                       # keep timezone.utc (datetime.UTC needs 3.11; plugin must load on any host)
]

[tool.ruff.lint.isort]
known-first-party = ["ctx_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
